# 抓龙助手 · Render 部署配置（Blueprint）
# 用法：把本项目推到 GitHub，然后在 Render 控制台 → New → Blueprint → 填仓库地址，即可一键部署。
# 注意：Render 服务器在美国，体彩官方接口会被 WAF 封禁(HTTP 567)，将自动降级到 500.com/okooo 备用源。
services:
  - type: web
    name: zhualong-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py --host 0.0.0.0 --no-browser
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
